<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重要なお知らせ</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      text-align: center;
      font-family: sans-serif;
    }

    .box {
      padding: 40px 20px;
    }

    img {
      max-width: 95%;
      height: auto;
      display: none;
      margin: 30px auto;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>重要なお知らせ</h1>
    <p>内容を確認するには下のボタンを押してください。</p>

    <button onclick="showCat()">確認する</button>

    <h2 id="message-top" style="display:none;">
      引っ掛かりましたね...(^_-)-☆
    </h2>
    <img id="cat" src="Image.jpg" alt="yoshi">

    <h2 id="message" style="display:none;">
      引っ掛かりましたね...(^_-)-☆
    </h2>
  </div>

  <script>
    function showCat() {
      document.getElementById("cat").style.display = "block";
      document.getElementById("message-top").style.display = "block";
      document.getElementById("message-bottom").style.display = "block";
    }
  </script>
</body>
</html>
